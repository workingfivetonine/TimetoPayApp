openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Receipt Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stores
    description: Store management
  - name: items
    description: Item management
  - name: receipts
    description: Receipt management
  - name: analytics
    description: Analytics and insights
  - name: shopping-list
    description: Shopping list generation
  - name: receipts-ai
    description: AI receipt parsing
  - name: admin
    description: Admin cross-user views
  - name: users
    description: Current user

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List all stores
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{id}:
    get:
      operationId: getStore
      tags: [stores]
      summary: Get a store by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Not found
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List all items
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/name-search:
    get:
      operationId: searchItemNames
      tags: [items]
      summary: Type-ahead item names, from the user's own items then the shared catalog
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: At least 2 characters; shorter queries return nothing.
      responses:
        "200":
          description: Matching names, the user's own first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemNameSearchResult"

  /items/name-suggestions:
    post:
      operationId: suggestItemNames
      tags: [items]
      summary: Suggest existing item names for scanned lines that almost match one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemNameSuggestionInput"
      responses:
        "200":
          description: >
            Advisory suggestions only, for names that near-match an item already
            bought at this store. Names that match exactly, or closely enough to
            be merged automatically on save, are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemNameSuggestionResult"

  /items/{id}/ran-out:
    post:
      operationId: markRanOut
      tags: [items]
      summary: Mark an item as ran out, recording the current timestamp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ran-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RanOutResponse"
        "404":
          description: Item not found

  /items/{id}/dismiss:
    post:
      operationId: dismissItem
      tags: [items]
      summary: Dismiss an item from the shopping list until it is purchased or runs out again
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissResponse"
        "404":
          description: Item not found

  /items/{id}/merge:
    post:
      operationId: mergeItem
      tags: [items]
      summary: Merge this item into another item (reassigns purchase history, deletes this item)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeItemInput"
      responses:
        "200":
          description: Merged item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Item not found

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get an item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item (name, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List all receipts
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Create a receipt manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get a receipt by ID with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipt with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /receipts/{id}/line-items:
    post:
      operationId: addLineItem
      tags: [receipts]
      summary: Add a line item to a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineItemInput"
      responses:
        "201":
          description: Created line item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineItem"

  /line-items/{id}:
    patch:
      operationId: updateLineItem
      tags: [receipts]
      summary: Update a line item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineItemUpdate"
      responses:
        "200":
          description: Updated line item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineItem"
    delete:
      operationId: deleteLineItem
      tags: [receipts]
      summary: Delete a line item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /analytics/daily-spend:
    get:
      operationId: getDailySpend
      tags: [analytics]
      summary: Daily spend totals for calendar view
      responses:
        "200":
          description: Daily spend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaySpend"

  /analytics/spend:
    get:
      operationId: getSpendAnalytics
      tags: [analytics]
      summary: Weekly spend totals with trend info (high/low flags)
      responses:
        "200":
          description: Weekly spend data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendAnalytics"

  /analytics/items/inactive:
    get:
      operationId: getInactiveItems
      tags: [analytics]
      summary: Items not purchased in 30–60 days and 60+ days
      responses:
        "200":
          description: Inactive items grouped by staleness bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InactiveItemsResult"

  /analytics/category-spend:
    get:
      operationId: getCategorySpend
      tags: [analytics]
      summary: Aggregate spend by item category
      responses:
        "200":
          description: Category spend breakdown with percentages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySpendResult"

  /analytics/export:
    get:
      operationId: getAnalyticsExport
      tags: [analytics]
      summary: Full data export — stores, items, and purchase history for the user
      responses:
        "200":
          description: All user data for export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportData"

  /analytics/items/{id}/price-history:
    get:
      operationId: getItemPriceHistory
      tags: [analytics]
      summary: Price history for an item across stores and time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPriceHistory"

  /analytics/stores/{id}/visits:
    get:
      operationId: getStoreVisits
      tags: [analytics]
      summary: All visits to a store with items purchased per visit, plus unique items list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store visits report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreVisitsReport"

  /analytics/items/{id}/history:
    get:
      operationId: getItemHistory
      tags: [analytics]
      summary: Full purchase history for a single item across all stores and dates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item purchase history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemHistoryReport"

  /analytics/stores/{id}/summary:
    get:
      operationId: getStoreSummary
      tags: [analytics]
      summary: Summary stats for a store including avg spend, top items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSummary"

  /shopping-list:
    get:
      operationId: getShoppingList
      tags: [shopping-list]
      summary: Get auto-generated shopping list from purchase history
      responses:
        "200":
          description: Shopping list with recurring and one-off items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"

  /shopping-list/saved-lists:
    get:
      operationId: getSavedShoppingLists
      tags: [shopping-list]
      summary: List user's saved shopping lists
      responses:
        "200":
          description: Array of saved list summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedShoppingList"
    post:
      operationId: createSavedShoppingList
      tags: [shopping-list]
      summary: Save a new shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedShoppingListInput"
      responses:
        "201":
          description: Created saved list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedShoppingList"

  /shopping-list/saved-lists/{id}:
    get:
      operationId: getSavedShoppingList
      tags: [shopping-list]
      summary: Get saved list with full item details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved list detail with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedShoppingListDetail"
        "404":
          description: Not found or not owned by user
    patch:
      operationId: renameSavedShoppingList
      tags: [shopping-list]
      summary: Rename a saved list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSavedShoppingListInput"
      responses:
        "200":
          description: Updated saved list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedShoppingList"
        "404":
          description: Not found or not owned by user
    delete:
      operationId: deleteSavedShoppingList
      tags: [shopping-list]
      summary: Delete a saved list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found or not owned by user

  /shopping-list/saved-lists/{id}/apply:
    post:
      operationId: applySavedShoppingList
      tags: [shopping-list]
      summary: Add all items from a saved list to the user's shopping list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Number of items added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyListResult"
        "404":
          description: Not found or not owned by user

  /receipts/parse:
    post:
      operationId: parseReceiptImage
      tags: [receipts-ai]
      summary: Parse a receipt image using AI and return extracted data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseReceiptInput"
      responses:
        "200":
          description: Parsed receipt data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedReceipt"

  /receipts/parse-and-save:
    post:
      operationId: parseAndSaveReceipt
      tags: [receipts-ai]
      summary: Parse a receipt image and save it (store + items + line items)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseReceiptInput"
      responses:
        "201":
          description: Saved receipt with all data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"

  /receipts/save-parsed:
    post:
      operationId: saveParsedReceipt
      tags: [receipts-ai]
      summary: Save an already-parsed (and user-corrected) receipt to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParsedReceipt"
      responses:
        "201":
          description: Saved receipt with all data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"

  /receipts/manual-entry:
    post:
      operationId: manualEntryReceipt
      tags: [receipts-ai]
      summary: Manually enter a receipt with store info and line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualEntryInput"
      responses:
        "201":
          description: Saved receipt with all data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"

  /receipts/detect-bounds:
    post:
      operationId: detectReceiptBounds
      tags: [receipts-ai]
      summary: Use AI to detect the bounding box of a receipt in a photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseReceiptInput"
      responses:
        "200":
          description: Bounding box as fractions (0–1) of the image dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptBounds"

  /receipts/parse-and-save-batch:
    post:
      operationId: parseAndSaveReceiptBatch
      tags: [receipts-ai]
      summary: Parse multiple images as a single receipt (combined photo) and save it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseReceiptBatchInput"
      responses:
        "201":
          description: Saved receipt with all data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"

  /receipts/parse-pdf:
    post:
      operationId: parsePdfReceipt
      tags: [receipts-ai]
      summary: Parse a PDF receipt and save it; each page becomes its own receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParsePdfInput"
      responses:
        "201":
          description: One saved receipt per PDF page that contained items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedReceiptsResult"

  /receipts/merge:
    post:
      operationId: mergeReceipts
      tags: [receipts]
      summary: Merge two or more of the user's receipts into a single receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeReceiptsInput"
      responses:
        "200":
          description: The merged receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptDetail"

  /me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /me/region:
    patch:
      operationId: updateMyRegion
      tags: [users]
      summary: Set the authenticated user's region (country, and state for the US)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionInput"
      responses:
        "200":
          description: The updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /me/notifications:
    get:
      operationId: getMyNotificationPreferences
      tags: [users]
      summary: Get the authenticated user's email reminder preferences
      responses:
        "200":
          description: The current notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    patch:
      operationId: updateMyNotificationPreferences
      tags: [users]
      summary: Update the authenticated user's email reminder preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesInput"
      responses:
        "200":
          description: The updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users with a summary of their data (admin only)
      responses:
        "200":
          description: List of users with per-user data summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/role:
    patch:
      operationId: adminSetUserRole
      tags: [admin]
      summary: Set a user's type/role (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetRoleInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request
        "404":
          description: User not found

  /admin/users/merge:
    post:
      operationId: adminMergeUsers
      tags: [admin]
      summary: Merge one user's data into another, then delete the source (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMergeUsersInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMergeResult"
        "400":
          description: Invalid request
        "404":
          description: User not found

  /admin/users/{userId}:
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user and all their data (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid request
        "404":
          description: User not found

  /admin/users/{userId}/force-password-reset:
    post:
      operationId: adminForcePasswordReset
      tags: [admin]
      summary: Require a user to set a new password at next sign-in (admin only)
      description: >
        Flags the user's current password as compromised in Clerk and revokes their
        sessions, so Clerk requires a reset before they can sign in again. Clerk
        exposes no admin "send a reset email" API, so the app sends its own
        `password_reset_required` Loops event afterwards, pointing the user at the
        self-service "Forgot password" flow — it carries no credential and no magic
        link. The send is fire-and-forget after Clerk succeeds, so a mail failure
        never turns a completed reset into an error, and it is a silent no-op until
        the Loop exists in the Loops dashboard. `emailSent` reflects only whether an
        address was on file, not delivery. No-op for users who sign in with Google
        and have no password.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionResult"
        "400":
          description: Invalid request
        "404":
          description: User not found
        "502":
          description: Clerk rejected the request

  /admin/users/{userId}/receipts:
    get:
      operationId: adminGetUserReceipts
      tags: [admin]
      summary: Get a specific user's receipts (admin only, read-only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserReceipts"

  /admin/users/{userId}/logins:
    get:
      operationId: adminGetUserLogins
      tags: [admin]
      summary: Get a user's most recent sign-ins (admin only, read-only)
      description: >
        Read live from Clerk's Sessions API, not from our database — we record no
        sign-in history of our own. Each Clerk session is created at sign-in, so
        `createdAt` is the moment the user signed in. Clerk publishes no retention
        guarantee for expired sessions, so this is a rolling window: it may return
        fewer than three entries for a long-dormant user even though they have
        signed in more times than that. One Clerk API call per request, so this is
        deliberately its own endpoint rather than a field on the user list.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's most recent sign-ins, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserLogins"
        "404":
          description: User not found
        "502":
          description: Clerk rejected the request

  /catalog/browse:
    get:
      operationId: browseCatalog
      tags: [catalog]
      summary: Browse the global price catalog grouped by category (all users)
      responses:
        "200":
          description: Catalog items grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBrowse"

  /catalog/add-to-list:
    post:
      operationId: addCatalogItemToList
      tags: [catalog]
      summary: Add a catalog item to the current user's shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogAddToListInput"
      responses:
        "200":
          description: Item added to the shopping list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Catalog item not found

  /admin/review-digest/test:
    post:
      operationId: adminSendTestReviewDigest
      tags: [admin]
      summary: Send a review digest email to the admin now (test/preview, admin only)
      responses:
        "200":
          description: Result of the manual digest send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewDigestResult"

  /admin/catalog/global:
    get:
      operationId: adminGetGlobalPrices
      tags: [admin]
      summary: Global most-recent price per canonical item across all users (admin only)
      responses:
        "200":
          description: Canonical items with overall and per-store most-recent prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogGlobalItem"

  /admin/analytics/custom-chart/meta:
    get:
      operationId: adminGetCustomChartMeta
      tags: [admin]
      summary: Whitelisted data sources and fields the custom chart builder can query (admin only)
      responses:
        "200":
          description: Every source, and its date/category/number fields, the builder can use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomChartMetaResult"

  /admin/analytics/custom-chart:
    get:
      operationId: adminGetCustomChart
      tags: [admin]
      summary: Run an admin-built chart query against a whitelisted data source (admin only)
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
          description: A source key from the meta endpoint (e.g. "receipts").
        - name: groupBy
          in: query
          required: true
          schema:
            type: string
          description: A date-field or category-field key from that source.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, year]
          description: Only used when groupBy is a date field. Defaults to month.
        - name: splitBy
          in: query
          required: false
          schema:
            type: string
          description: A category-field key for a second line/series per value. Only valid when groupBy is a date field.
        - name: aggregation
          in: query
          required: true
          schema:
            type: string
            enum: [count, sum, avg, min, max]
        - name: measure
          in: query
          required: false
          schema:
            type: string
          description: A number-field key. Required unless aggregation is count.
      responses:
        "200":
          description: The chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomChartResult"
        "400":
          description: The combination of source/groupBy/aggregation/measure/splitBy isn't valid
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /admin/catalog/price-growth:
    get:
      operationId: adminGetPriceGrowth
      tags: [admin]
      summary: Price trajectory per item, split by store, for items with enough history (admin only)
      parameters:
        - name: minSpanDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >
            Minimum days between an item's first and last recorded price WITHIN
            the window before it is included. Defaults to 14.
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 90, 182, 365]
          description: >
            Reporting window; 0 means all time, measuring from each item's first
            recorded price. Only these values are accepted; anything else falls
            back to the default of 90.
      responses:
        "200":
          description: The window, plus items ordered by steepest price growth first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPriceGrowthResult"

  /admin/catalog/items:
    get:
      operationId: adminListCatalogItems
      tags: [admin]
      summary: List canonical catalog items with members and merge suggestions (admin only)
      responses:
        "200":
          description: Canonical items and suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryList"

  /admin/catalog/stores:
    get:
      operationId: adminListCatalogStores
      tags: [admin]
      summary: List canonical catalog stores with members and merge suggestions (admin only)
      responses:
        "200":
          description: Canonical stores and suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryList"

  /admin/catalog/items/merge:
    post:
      operationId: adminMergeCatalogItems
      tags: [admin]
      summary: Merge one canonical item into another (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogMergeInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/stores/merge:
    post:
      operationId: adminMergeCatalogStores
      tags: [admin]
      summary: Merge one canonical store into another (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogMergeInput"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/items/{id}:
    patch:
      operationId: adminUpdateCatalogItem
      tags: [admin]
      summary: Rename or re-icon a canonical item (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemUpdate"
      responses:
        "200":
          description: Updated canonical item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/stores/{id}:
    patch:
      operationId: adminUpdateCatalogStore
      tags: [admin]
      summary: Update a canonical store — rename, logo, or website (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogStoreUpdate"
      responses:
        "200":
          description: Updated canonical store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/items/{id}/split:
    post:
      operationId: adminSplitCatalogItem
      tags: [admin]
      summary: Split one member name out of a canonical item into its own entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSplitInput"
      responses:
        "200":
          description: The new canonical item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/stores/{id}/split:
    post:
      operationId: adminSplitCatalogStore
      tags: [admin]
      summary: Split one member name out of a canonical store into its own entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSplitInput"
      responses:
        "200":
          description: The new canonical store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"

  /admin/catalog/items/suggest-categories:
    post:
      operationId: adminSuggestCatalogItemCategories
      tags: [admin]
      summary: AI-suggest a category for catalog items (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCategorySuggestInput"
      responses:
        "200":
          description: Suggested categories, one per requested item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCategorySuggestionList"

  /admin/catalog/items/suggest-duplicates:
    post:
      operationId: adminSuggestCatalogItemDuplicates
      tags: [admin]
      summary: AI-find likely duplicate catalog items to merge (admin only)
      responses:
        "200":
          description: Suggested merge groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSuggestionList"

  /admin/catalog/stores/suggest-duplicates:
    post:
      operationId: adminSuggestCatalogStoreDuplicates
      tags: [admin]
      summary: AI-find likely duplicate catalog stores to merge (admin only)
      responses:
        "200":
          description: Suggested merge groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSuggestionList"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CatalogGlobalStorePrice:
      type: object
      required: [catalogStoreId, storeName, latestPrice, latestDate]
      properties:
        catalogStoreId:
          type: integer
        storeName:
          type: string
        latestPrice:
          type: number
        latestDate:
          type: string

    CatalogGlobalItem:
      type: object
      required: [catalogItemId, name, overallLatestPrice, overallLatestStoreName, overallLatestDate, stores]
      properties:
        catalogItemId:
          type: integer
        name:
          type: string
        icon:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        overallLatestPrice:
          type: number
        overallLatestStoreId:
          type: ["integer", "null"]
        overallLatestStoreName:
          type: string
        overallLatestDate:
          type: string
        stores:
          type: array
          items:
            $ref: "#/components/schemas/CatalogGlobalStorePrice"

    ItemNameSearchMatch:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [history, catalog]
          description: >
            history = one of the user's own items; catalog = a canonical name
            from the shared catalog.

    ItemNameSearchResult:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ItemNameSearchMatch"

    ItemNameSuggestionInput:
      type: object
      required: [storeName, names]
      properties:
        storeName:
          type: string
          description: Only items bought at this store are considered.
        names:
          type: array
          items:
            type: string
          description: Scanned line-item names, in order. At most 100 are considered.

    ItemNameSuggestion:
      type: object
      required: [index, suggestedName, itemId, score]
      properties:
        index:
          type: integer
          description: Position in the submitted names array.
        suggestedName:
          type: string
        itemId:
          type: integer
        score:
          type: number
          description: Similarity, 0–1.

    ItemNameSuggestionResult:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ItemNameSuggestion"

    AdminCustomChartField:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
        unit:
          type: string
          enum: [currency, count]
          description: Only present on a measure field; tells the client how to format its values.

    AdminCustomChartSource:
      type: object
      required: [key, label, dateFields, categoryFields, measureFields]
      properties:
        key:
          type: string
        label:
          type: string
        dateFields:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartField"
        categoryFields:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartField"
        measureFields:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartField"
          description: Empty when the source has no number field — count is still available.

    AdminCustomChartMetaResult:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartSource"

    AdminCustomChartPoint:
      type: object
      required: [bucket, value]
      properties:
        bucket:
          type: string
          description: A date-bucket key (e.g. "2026-03") when grouped by date, or a category label otherwise.
        value:
          type: number

    AdminCustomChartSeries:
      type: object
      required: [key, points]
      properties:
        key:
          type: string
          description: The split value this line represents, or "all" when not split.
        points:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartPoint"

    AdminCustomChartResult:
      type: object
      required: [kind, unit, series, otherCount, rowCount]
      properties:
        kind:
          type: string
          enum: [time, category]
          description: time = a line chart over date buckets; category = a ranked bar chart.
        unit:
          type: string
          enum: [currency, count]
          description: Resolved server-side from the chosen measure (or "count" for the count aggregation).
        series:
          type: array
          items:
            $ref: "#/components/schemas/AdminCustomChartSeries"
        otherCount:
          type: integer
          description: Distinct split values / categories folded into one "Other" entry beyond the display cap.
        rowCount:
          type: integer
          description: Rows that actually fed the chart, after excluding any missing the chosen measure.

    AdminPriceGrowthResult:
      type: object
      required: [windowDays, windowStart, windowEnd, items]
      properties:
        windowDays:
          type: integer
          description: The window applied; 0 means all time.
        windowStart:
          type: string
          description: >
            First day of the reporting window, YYYY-MM-DD. For the all-time
            window this is the earliest price on record across the returned
            items, not a fixed offset from today.
        windowEnd:
          type: string
          description: >
            Last day of the reporting window, YYYY-MM-DD. Charts use
            windowStart/windowEnd as a shared x-domain so two items are directly
            comparable.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceGrowthItem"

    AdminPriceGrowthPoint:
      type: object
      required: [date, price]
      properties:
        date:
          type: string
          description: Purchase day, YYYY-MM-DD. Same-day purchases are averaged into one point.
        price:
          type: number

    AdminPriceGrowthStore:
      type: object
      required: [catalogStoreId, storeName, firstPrice, lastPrice, points]
      properties:
        catalogStoreId:
          type: integer
        storeName:
          type: string
        countryCode:
          type: ["string", "null"]
        firstPrice:
          type: number
        lastPrice:
          type: number
        growthPct:
          type: ["number", "null"]
          description: Null when this store has only one dated point — a single observation has no growth.
        points:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceGrowthPoint"

    AdminPriceGrowthItem:
      type: object
      required:
        [catalogItemId, name, firstDate, lastDate, spanDays, purchaseCount, firstPrice, lastPrice, growthPct, stores]
      properties:
        catalogItemId:
          type: integer
        name:
          type: string
        icon:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        firstDate:
          type: string
        lastDate:
          type: string
        spanDays:
          type: integer
        purchaseCount:
          type: integer
        firstPrice:
          type: number
        lastPrice:
          type: number
        growthPct:
          type: number
          description: Percent change from the earliest to the latest observation across all stores.
        stores:
          type: array
          items:
            $ref: "#/components/schemas/AdminPriceGrowthStore"

    CatalogMember:
      type: object
      required: [normalizedName, displayName, count]
      properties:
        normalizedName:
          type: string
        displayName:
          type: string
        count:
          type: integer

    CatalogEntry:
      type: object
      required: [id, canonicalName, members, totalCount]
      properties:
        id:
          type: integer
        canonicalName:
          type: string
        icon:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        logo:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        members:
          type: array
          items:
            $ref: "#/components/schemas/CatalogMember"
        totalCount:
          type: integer

    CatalogSuggestion:
      type: object
      required: [ids, names, reason]
      properties:
        ids:
          type: array
          items:
            type: integer
        names:
          type: array
          items:
            type: string
        reason:
          type: string

    CatalogEntryList:
      type: object
      required: [entries, suggestions]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntry"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSuggestion"

    CatalogSuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSuggestion"

    CatalogCategorySuggestInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer

    CatalogCategorySuggestion:
      type: object
      required: [id, category]
      properties:
        id:
          type: integer
        category:
          type: string

    CatalogCategorySuggestionList:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategorySuggestion"

    CatalogMergeInput:
      type: object
      required: [sourceId, targetId]
      properties:
        sourceId:
          type: integer
        targetId:
          type: integer

    CatalogItemUpdate:
      type: object
      properties:
        canonicalName:
          type: string
        icon:
          type: ["string", "null"]
        category:
          type: ["string", "null"]

    CatalogStoreUpdate:
      type: object
      required: [canonicalName]
      properties:
        canonicalName:
          type: string
        logo:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]

    CatalogSplitInput:
      type: object
      required: [normalizedName]
      properties:
        normalizedName:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    UserRole:
      type: string
      enum: [master_admin, family, general]

    CurrentUser:
      type: object
      required: [id, isAdmin, role]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        countryCode:
          type: ["string", "null"]
          description: ISO-3166 alpha-2 country code; null until the user picks a region
        stateCode:
          type: ["string", "null"]
          description: USPS 2-letter state code; only set when countryCode is "US"

    NotificationFrequency:
      type: string
      enum: [weekly, monthly]
      description: How often a scheduled notification type fires

    NotificationPreferences:
      type: object
      required:
        [
          notifyListExport,
          notifyReceiptReminders,
          notifySpendSummary,
          notifyListExportFrequency,
          notifyReceiptRemindersFrequency,
          notifySpendSummaryFrequency,
        ]
      properties:
        notifyListExport:
          type: boolean
          description: Grocery-list export nudge
        notifyReceiptReminders:
          type: boolean
          description: Receipt-upload inactivity nudge
        notifySpendSummary:
          type: boolean
          description: Spend summary emails
        notifyListExportFrequency:
          $ref: "#/components/schemas/NotificationFrequency"
        notifyReceiptRemindersFrequency:
          $ref: "#/components/schemas/NotificationFrequency"
        notifySpendSummaryFrequency:
          $ref: "#/components/schemas/NotificationFrequency"

    NotificationPreferencesInput:
      type: object
      description: Partial update — only the provided fields are changed.
      properties:
        notifyListExport:
          type: boolean
        notifyReceiptReminders:
          type: boolean
        notifySpendSummary:
          type: boolean
        notifyListExportFrequency:
          $ref: "#/components/schemas/NotificationFrequency"
        notifyReceiptRemindersFrequency:
          $ref: "#/components/schemas/NotificationFrequency"
        notifySpendSummaryFrequency:
          $ref: "#/components/schemas/NotificationFrequency"

    RegionInput:
      type: object
      required: [countryCode]
      properties:
        countryCode:
          type: string
          description: ISO-3166 alpha-2 country code
        stateCode:
          type: ["string", "null"]
          description: USPS 2-letter state code; required when countryCode is "US", ignored otherwise

    AdminUser:
      type: object
      required: [id, isAdmin, role, createdAt, storeCount, itemCount, receiptCount, totalSpend]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
          description: Public handle shown on community posts; null until profile setup
        isAdmin:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
        countryCode:
          type: ["string", "null"]
        stateCode:
          type: ["string", "null"]
        boardAutoApprove:
          type: boolean
        storeCount:
          type: integer
        itemCount:
          type: integer
        receiptCount:
          type: integer
        totalSpend:
          type: number

    AdminSetRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    AdminMergeUsersInput:
      type: object
      required: [sourceUserId, targetUserId]
      properties:
        sourceUserId:
          type: string
        targetUserId:
          type: string

    AdminMergeResult:
      type: object
      required: [targetUserId, movedStores, movedItems, movedReceipts]
      properties:
        targetUserId:
          type: string
        movedStores:
          type: integer
        movedItems:
          type: integer
        movedReceipts:
          type: integer

    AdminActionResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        emailSent:
          type: boolean
          description: >
            Only returned by force-password-reset: whether the user had an email
            address to notify. Not a delivery confirmation — the Loops event is
            fire-and-forget and no-ops if the Loop isn't built yet.

    AdminReviewDigestResult:
      type: object
